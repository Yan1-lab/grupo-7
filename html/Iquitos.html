<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iquitos | Reserva</title>
    <link rel="stylesheet" href="/css/ramas.css">
</head>
<body>

<header class="topbar">
    <h1>Iquitos Amazon Lodge</h1>
    <button class="btn-reserva-top">Reserva ahora</button>
</header>

<section class="galeria-container">

    <div class="imagen-principal">
        <img id="img-principal" src="https://upload.wikimedia.org/wikipedia/commons/2/21/Catedral_de_Iquitos%2C_Per%C3%BA.jpg" alt="Iquitos">
    </div>

    <div class="miniaturas">
        <img src="C:\Users\DOCENTE\Downloads\Img1_Iquitos.png" onclick="cambiarImagen(this)">
        <img src="https://losdosviajeros.com/img/peru/boulevard-de-iquitos-las-mejores-vistas-de-la-ciudad.jpg" onclick="cambiarImagen(this)">
        <img src="https://www.peru.travel/Contenido/Noticia/Imagen/es/2035/1.0/Principal/iquitos-wma-2023-desktop.jpg" onclick="cambiarImagen(this)">
        <img src="https://viajeradicta.com/wp-content/uploads/2018/11/amanecer-malecon-tarapaca-iquitos-peru-8.jpg" onclick="cambiarImagen(this)">
    </div>

</section>

<section class="info-container">

    <div class="info-left">
        <h2>Descripción</h2>
        <p>
            Lodge ecológico en plena selva de Iquitos con experiencias en la Amazonía,
            excursiones por el río y contacto directo con la naturaleza.
        </p>

        <div class="tags">
            <span>Desayuno incluido</span>
            <span>Vista a la selva</span>
            <span>Excursiones guiadas</span>
        </div>

        <h2>Ubicación</h2>
        <div class="mapa">
            <iframe
                src="https://www.google.com/maps?q=Iquitos&output=embed"
                width="100%"
                height="300"
                style="border:0;">
            </iframe>
        </div>
    </div>

    <div class="info-right">
        <div class="precio-box">
            <h2>$100 / noche</h2>
            <button class="btn-reservar">Reservar ahora</button>
        </div>

        <div class="rating">
            ⭐ 9.3 - Aventura en la selva
        </div>
    </div>

</section>

<script src="/script.js"></script>

</body>
</html>
